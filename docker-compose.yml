version: '3.8'

services:
  studio22:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studio22-container
    ports:
      - "8080:80"
    restart: always
    env_file:
      - .env.production
    networks:
      - studio22-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  studio22-network:
    driver: bridge
