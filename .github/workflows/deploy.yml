name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Au jina la branch yako (mfano: master)

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Sehemu ya Typecheck imeondolewa hapa ili kuzuia makosa ya TypeScript

      - name: Run Linter (Optional)
        run: npm run lint || echo "No lint script found"

  deploy:
    needs: test-and-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 83.229.83.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /var/www/studio22demo/studio22 && ./deploy.sh
