name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 83.229.83.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/studio22demo/studio22
            chmod +x deploy.sh
            ./deploy.sh
